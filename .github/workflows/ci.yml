name: YoYo CI & Architecture Gates

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Quality, Structure, Docs & Unit Tests (Python ${{ matrix.python-version }})
    # pin 到 ubuntu-24.04:ubuntu-latest 将于 2026-10-19 迁移到 Ubuntu 26,
    # 迁移日突然换基座镜像可能让 CI 无关变红;需要升级时再显式改这里。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU PyTorch and package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,checkpoint,promo]"

      - name: Run Ruff Lint Gate
        run: PYTHONPATH=src python -m ruff check src/ tests/ examples/ site/promo/ check_v2_quality.py check_structure.py check_docs.py

      - name: Run Ruff Format Gate
        run: PYTHONPATH=src python -m ruff format --check src/ tests/ examples/ site/promo/

      - name: Run AST & Code Quality Gate
        run: PYTHONPATH=src python check_v2_quality.py

      - name: Run Component Structure & Dependency Gate
        run: python check_structure.py

      - name: Run Documentation & Link Integrity Gate
        run: python check_docs.py

      - name: Run Unit & Component Integration Tests
        run: PYTHONPATH=src:. pytest tests/v2 -v

      - name: Run All Composable Example Scripts
        run: |
          for script in examples/*.py; do
            echo "=== Running $script ==="
            PYTHONPATH=src:. python "$script"
          done
