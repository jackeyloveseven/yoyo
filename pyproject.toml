[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoyo-mmtrainer"
version = "2.0.1"
description = "YoYo (You Only Yield Once): Composable Post-Training, Distillation & RL Scaffold for Flow-Matching and Diffusion Models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
keywords = [
  "diffusion",
  "flow-matching",
  "dpo",
  "rlhf",
  "grpo",
  "distillation",
  "lora-moe",
  "fsdp2",
  "multimodal",
]
dependencies = [
  "pydantic>=2.13,<3",
]

[project.urls]
Homepage = "https://github.com/jackeyloveseven/yoyo"
Repository = "https://github.com/jackeyloveseven/yoyo"
Issues = "https://github.com/jackeyloveseven/yoyo/issues"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]
checkpoint = [
  "safetensors>=0.6,<1",
  "torch>=2.1",
  "torchvision>=0.16",
  "Pillow>=10.0",
]
# 宣传物料:site/promo/render_promo.py 与 tests/v2/test_promo_video.py 的真实依赖。
# matplotlib 是 math_image() 的函数内 import(CI 不装则 test_formulas_are_typeset
# 直接 ImportError 红),numpy/Pillow 为渲染器与测试共用的模块级依赖。
promo = [
  "matplotlib>=3.8",
  "numpy",
  "Pillow>=10.0",
]

[project.scripts]
mmtrain = "mmtrainer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests/v2"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
